syntax = "proto3";

package dtask.v1;

option go_package = "github.com/monaaoua9/dtask/api/gen/dtask/v1;dtaskv1";

// Peer-to-peer consensus RPCs. Only other cluster nodes should call these.
service RaftService {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
  // leader asks a caught-up follower to start an election right now
  rpc TimeoutNow(TimeoutNowRequest) returns (TimeoutNowResponse);
}

enum EntryType {
  ENTRY_TYPE_UNSPECIFIED = 0;
  ENTRY_TYPE_COMMAND = 1;
  ENTRY_TYPE_NOOP = 2;
  ENTRY_TYPE_CONFIG = 3;
}

message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  EntryType type = 3;
  bytes data = 4;
}

message RequestVoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
  // pre-vote probes dont bump terms or grant durable votes
  bool pre_vote = 5;
  // set when the election was triggered by a leadership hand-off, so voters
  // skip their "I still hear a leader" check
  bool leadership_transfer = 6;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
  // fast log backtracking hints, see raft handleAppendEntries
  uint64 conflict_index = 4;
  uint64 conflict_term = 5;
}

message InstallSnapshotRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  bytes configuration = 5;
  bytes data = 6;
}

message InstallSnapshotResponse {
  uint64 term = 1;
}

message TimeoutNowRequest {
  uint64 term = 1;
  string leader_id = 2;
}

message TimeoutNowResponse {
  uint64 term = 1;
}
