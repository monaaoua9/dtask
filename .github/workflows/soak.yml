name: soak

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      duration:
        description: how long to run, e.g. 20m
        default: 20m

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: sustained load with periodic leader crashes
        env:
          DTASK_SOAK: ${{ inputs.duration || '20m' }}
        run: go test -race -run 'TestSoak$' -v -timeout 55m ./internal/node
